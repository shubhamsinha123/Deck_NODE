  # ── STOCKS & AI RECOMMENDATION ────────────────────────────────────────────

  /api/stocks:
    get:
      tags: [stocks]
      summary: List all tracked Indian stocks
      security:
        - bearerAuth: []
      description: >
        Retrieve tracked equities across NSE & BSE with real-time price snapshot,
        day change %, 52-week high/low, sector, market cap, and latest AI recommendation badge.
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Search by symbol or company name (case-insensitive regex)
          example: RELIANCE
        - in: query
          name: sector
          schema:
            type: string
          description: Filter by sector name
          example: Financial Services
        - in: query
          name: market_cap
          schema:
            type: string
            enum: [LARGE, MID, SMALL, ALL]
          description: Filter by market capitalization category
          example: LARGE
