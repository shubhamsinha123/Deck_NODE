      summary: Basic health check
      description: Returns 200 if DB connected, 503 if disconnected.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthBasic'
        '503':
          description: Service unhealthy — DB disconnected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthBasic'

  /api/v1/health/details:
    get:
      tags: [health]
      summary: Detailed health check with memory, process, and DB diagnostics
      responses:
        '200':
          description: Detailed health information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDetailed'
        '503':
          description: Service unhealthy or internal error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: DOWN
                  timestamp:
                    type: string
                    format: date-time
                  error:
                    type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # ── Shared ──────────────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      properties:
        data:
          nullable: true
          example: null
        message:
          type: string
          example: Something went wrong
        status:
          type: string
          example: FAILURE
        error:
          type: string
          example: Detailed error message

    TokenPair:
      type: object
      properties:
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expires_in:
          type: integer
          example: 3600
        user:
          type: object
          properties:
            id:
              type: string
              example: user123
            name:
              type: string
              example: John Doe

    # ── Users ───────────────────────────────────────────────────────────────

    User:
      type: object
      properties:
        _id:
          type: string
          example: 6a886b739b6a5ddb9b90ba51
        id:
          type: string
          example: T006
        name:
          type: string
          example: timtim
        mobileNumber:
          type: string
          example: "+919876543210"
        location:
          type: string
          example: cg
        date:
          type: string
          format: date-time
          example: '2026-08-21T00:00:00.000Z'
        country:
          type: string
          example: India
        visaStatus:
          type: string
          example: Approved
        eDate:
          type: string
          format: date-time
        hasPassword:
          type: boolean
          example: true
        role:
          type: string
          enum: [user, superuser, admin, superadmin]
          example: user
        properties:
          type: object
          nullable: true
          properties:
            from:
              type: object
              properties:
                _id:
                  type: string
                city:
                  type: string
                  example: Mumbai
                code:
                  type: string
                  example: BOM
                country:
                  type: string
                  example: India
                name:
                  type: string
                  example: Chhatrapati Shivaji International Airport
            to:
              type: object
              properties:
                _id:
                  type: string
                city:
                  type: string
                  example: Bangalore
                code:
                  type: string
                  example: BLR
                country:
                  type: string
                  example: India
                name:
                  type: string
                  example: Kempegowda International Airport
            class:
              type: string
              example: Premium Economy Class
            date:
              type: string
              example: '2025-11-28'
            seat:
              type: string
              example: 3AE
            setNewsletter:
              type: boolean
              example: false
        musicList:
          type: array
          items:
            type: object

    UserInput:
      type: object
      required: [id, password]
      properties:
        id:
          type: string
          example: user@example.com
        password:
          type: string
          example: strongPassword123
        role:
          type: string
          enum: [user, superuser, admin, superadmin]
          example: user

    JsonPatchOperation:
      type: object
      required: [op, path]
      properties:
        op:
          type: string
          enum: [add, replace, remove, copy, move, test]
          description: RFC 6902 patch operation code
          example: replace
        path:
          type: string
          description: RFC 6901 JSON pointer path (case-insensitive key lookup supported)
          example: /properties/from/name
        value:
          description: Value for add, replace, or test operations
          example: Chhatrapati Shivaji Maharaj International Airport
        from:
          type: string
          description: Source JSON pointer path for copy and move operations
          example: /location

    # ── Admins ──────────────────────────────────────────────────────────────

    Admin:
      type: object
      properties:
        _id:
          type: string
        MID:
          type: string
          example: ADM001
        role:
          type: string
          example: admin

    AdminInput:
      type: object
      required: [MID, MPIN]
      properties:
        MID:
          type: string
          example: ADM001
        MPIN:
          type: string
          example: "1234"
        role:
          type: string
          example: admin

    # ── Airports ────────────────────────────────────────────────────────────

    Airport:
      type: object
      properties:
        _id:
          type: string
        airportCode:
          type: string
          example: BOM
        airportName:
          type: string
          example: Chhatrapati Shivaji Maharaj International Airport
        city:
          type: string
          example: Mumbai
        country:
          type: string
          example: India

    # ── Pricing ─────────────────────────────────────────────────────────────

    Price:
      type: object
      properties:
        _id:
          type: string
        codeFrom:
          type: string
          example: BOM
        codeTo:
          type: string
          example: DEL
        price:
          type: number
          example: 3500
        currency:
          type: string
          example: INR

    PriceInput:
      type: object
      required: [codeFrom, codeTo, price]
      properties:
        codeFrom:
          type: string
          example: BOM
        codeTo:
          type: string
          example: DEL
        price:
          type: number
          example: 3500
        currency:
          type: string
          example: INR

    # ── Blogs ───────────────────────────────────────────────────────────────

    Blog:
      type: object
      properties:
        _id:
          type: string
        slug:
          type: string
          example: top-10-airports
        title:
          type: string
          example: Top 10 Airports in India
        content:
          type: string
        author:
          type: string
        createdAt:
          type: string
          format: date-time

    BlogInput:
      type: object
      required: [slug, title]
      properties:
        slug:
          type: string
          example: top-10-airports
        title:
          type: string
          example: Top 10 Airports in India
        content:
          type: string
        author:
          type: string

    # ── Countries ───────────────────────────────────────────────────────────

    Country:
      type: object
      properties:
        _id:
          type: string
        countryCode:
          type: string
          example: IN
        countryName:
          type: string
          example: India
        flag:
          type: string
          example: IN-flag

    CountryInput:
      type: object
      required: [countryCode, countryName]
      properties:
        countryCode:
          type: string
          example: IN
        countryName:
          type: string
          example: India
        flag:
          type: string

    # ── Bookings ────────────────────────────────────────────────────────────

    Booking:
      type: object
      properties:
        _id:
          type: string
          example: 64f1a2b3c4d5e6f7a8b9c0d1
        userEntryStep:
          type: integer
          example: 1
        userEmail:
          type: string
          format: email
          example: toto@gmail.com
        userPhone:
          type: string
          example: "+919876543210"
        userAddress:
          type: string
          example: 12 Main Street, Mumbai
        passengerData:
          type: array
          items:
            type: object
            properties:
              passFirstName:
                type: string
                example: John
              passLastName:
                type: string
                example: Doe
              passGender:
                type: string
                example: Male
        flightDetails:
          type: object
          properties:
            flightName:
              type: string
              example: Air India
            flightNumber:
              type: string
              example: AI302
            flightClass:
              type: string
              example: Economy
            flightDepartureDate:
              type: string
              example: "2024-12-01"
            flightArrivalDate:
              type: string
              example: "2024-12-01"
            flightDepartureTime:
              type: string
              example: "06:00"
            flightArrivalTime:
              type: string
              example: "09:30"
            flightDepartureCity:
              type: string
              example: Mumbai
            flightArrivalCity:
              type: string
              example: Delhi
            flightDate:
              type: string
              example: "2024-12-01"
            flightPassengerCount:
              type: integer
              example: 1
            flightFareDetails:
              type: object
              properties:
                baseFare:
                  type: number
                  example: 3500
                taxes:
                  type: number
                  example: 450
                convinenceFee:
                  type: number
                  example: 150
                baggageFee:
                  type: number
                  example: 0
                seatFee:
                  type: number
                  example: 0
                discount:
                  type: number
                  example: 0
                totalFare:
                  type: number
                  example: 4100
        addOns:
          type: object
          properties:
            extrabaggage:
              type: boolean
              example: false
            meal:
              type: boolean
              example: true
            priorityboarding:
              type: boolean
              example: false
            extrabaggageCount:
              type: integer
              example: 0
            seatSelected:
              type: array
              items:
                type: string
              example: ["12A"]
        bookingDate:
          type: string
          format: date-time
          example: "2024-11-20T10:30:00Z"
        bookingStatus:
          type: string
          example: CONFIRMED
        hasPassword:
          type: boolean
          example: false

    BookingInput:
      type: object
      required:
        - userEmail
        - userPhone
        - passengerData
        - flightDetails
        - addOns
        - bookingStatus
      properties:
        userEntryStep:
          type: integer
          example: 1
        userEmail:
          type: string
          format: email
          example: toto@gmail.com
        userPhone:
          type: string
          example: "+919876543210"
        userAddress:
          type: string
          example: 12 Main Street, Mumbai
        passengerData:
          type: array
          items:
            type: object
        flightDetails:
          type: object
        addOns:
          type: object
        bookingStatus:
          type: string
          example: CONFIRMED
        hasPassword:
          type: boolean
          example: false
        password:
          type: string
          example: mySecretPass

    # ── Cars ────────────────────────────────────────────────────────────────

    Car:
      type: object
      properties:
        _id:
          type: string
        model:
          type: string
          example: Model 3
        maker:
          type: string
          example: Tesla
        engineType:
          type: string
          example: Electric
        transmission:
          type: string
          example: Automatic
        seats:
          type: integer
          example: 5
        pricePerDay:
          type: number
          example: 120

    CarInput:
      type: object
      required: [model, maker, engineType, transmission]
      properties:
        model:
          type: string
          example: Model 3
        maker:
          type: string
          example: Tesla
        engineType:
          type: string
          example: Electric
        transmission:
          type: string
          example: Automatic
        seats:
          type: integer
          example: 5
        pricePerDay:
          type: number
          example: 120

    # ── Health ──────────────────────────────────────────────────────────────

    HealthBasic:
      type: object
      properties:
        status:
          type: string
          enum: [UP, DOWN]
          example: UP
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
          example: 3600.5
        service:
          type: string
          example: api_connect
        environment:
          type: string
          example: production
        database:
          type: string
          enum: [Connected, Disconnected]
          example: Connected

    HealthDetailed:
      allOf:
        - $ref: '#/components/schemas/HealthBasic'
        - type: object
          properties:
            version:
              type: string
              example: 1.0.0
            checks:
              type: object
              properties:
                database:
                  type: object
                memory:
                  type: object
                process:
                  type: object