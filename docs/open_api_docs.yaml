openapi: 3.0.3
info:
  title: Deck API
  version: 1.0.0
  description: >
    OpenAPI specification for the Deck Express backend.
    All routes are mounted under /api/v1 unless marked as legacy.
servers:
  - url: https://deck-api-g59h.onrender.com
    description: Production
  - url: http://localhost:5000
    description: Local development
tags:
  - name: auth
    description: JWT authentication (legacy + OAuth 2.0 sessions)
  - name: users
    description: User session management and CRUD
  - name: admin
    description: Admin session management and CRUD
  - name: airports
    description: Airport data
  - name: pricing
    description: Flight pricing records
  - name: blogs
    description: Blog posts
  - name: countries
    description: Country records
  - name: bookings
    description: Flight booking records
  - name: cars
    description: Car rental records
  - name: health
    description: Service health checks

paths:

  # ── AUTH (Legacy) ─────────────────────────────────────────────────────────

  /infoJwt:
    get:
      tags: [auth]
      summary: Legacy info endpoint (no auth required)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Hello from local

  /api/v1/auth/sessions:
    post:
      tags: [auth]
      summary: Admin/legacy login — issue JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, password]
              properties:
                id:
                  type: string
                  example: admin01
                password:
                  type: string
                  example: secret
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/token/verify:
    post:
      tags: [auth]
      summary: Verify a legacy JWT token
      parameters:
        - in: header
          name: authorization
          required: true
          schema:
            type: string
          example: Bearer <token>
      responses:
        '200':
          description: Token verified or expired message returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  authData:
                    type: object

  # ── USERS ─────────────────────────────────────────────────────────────────

  /api/v1/auth/user-sessions:
    post:
      tags: [users]
      summary: User login — returns access_token + refresh_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, password]
              properties:
                id:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: myPassword123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TokenPair'
                  message:
                    type: string
                    example: Login successful
                  status:
                    type: string
                    example: SUCCESS
        '400':
          description: Missing id or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/user-sessions/login:
    post:
      tags: [users]
      summary: User login with full user details in response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, password]
              properties:
                id:
                  type: string
                  example: user@example.com
                password:
                  type: string
      responses:
        '200':
          description: Login successful — tokens + user profile returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  message:
                    type: string
                    example: Login successful
                  status:
                    type: string
                    example: SUCCESS
        '400':
          description: Missing id or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/user-sessions/refresh:
    post:
      tags: [users]
      summary: Refresh access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TokenPair'
                  message:
                    type: string
                    example: Token refreshed successfully
                  status:
                    type: string
                    example: SUCCESS
        '400':
          description: refresh_token missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/user-sessions/revoke:
    post:
      tags: [users]
      summary: Revoke refresh token (logout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token revoked — user logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    nullable: true
                    example: null
                  message:
                    type: string
                    example: Token revoked successfully. You are logged out.
                  status:
                    type: string
                    example: SUCCESS
        '400':
          description: refresh_token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users:
    post:
      tags: [users]
      summary: Create user records (admin/superadmin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: User(s) created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  message:
                    type: string
                    example: User's data created successfully
                  status:
                    type: string
                    example: SUCCESS
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{userId}:
    get:
      tags: [users]
      summary: Get a user by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          description: Unique user identifier
          schema:
            type: string
          example: T006
      responses:
        '200':
          description: User fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  message:
                    type: string
                    example: User fetched successfully
                  status:
                    type: string
                    example: SUCCESS
              example:
                data:
                  - _id: 6a886b739b6a5ddb9b90ba51
                    id: T006
                    name: timtim
                    location: cg
                    date: '2026-08-21T00:00:00.000Z'
                    country: India
                    hasPassword: true
                    role: user
                    properties:
                      from:
                        _id: 6a886cc991555ca41922c028
                        city: Mumbai
                        code: BOM
                        country: India
                        name: Chhatrapati Shivaji International Airport
                      to:
                        _id: 6a886cc991555ca41922c027
                        city: Bangalore
                        code: BLR
                        country: India
                        name: Kempegowda International Airport
                      class: Premium Economy Class
                      date: '2025-11-28'
                      seat: 3AE
                      setNewsletter: false
                message: User fetched successfully
                status: SUCCESS
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                message: User with ID 'T006' not found
                status: NOT_FOUND
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [users]
      summary: Update a user by ID using RFC 6902 JSON Patch
      description: >
        Performs partial updates, removals, additions, moves, copies, or test assertions on a user document.
        Requires payload to be an array of JSON patch operations (`[ { op, path, value } ]`).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          description: Unique user identifier
          schema:
            type: string
          example: T006
      requestBody:
        required: true
        description: Array of RFC 6902 JSON Patch operation objects
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/JsonPatchOperation'
            examples:
              allOpCodesCombination:
                summary: Combination of all JSON Patch operation codes
                value:
                  - op: test
                    path: /location
                    value: cg
                  - op: replace
                    path: /Name
                    value: Name Updated
                  - op: replace
                    path: /properties/from/name
                    value: Chhatrapati Shivaji Maharaj International Airport
                  - op: remove
                    path: /properties/seat
                  - op: add
                    path: /properties/from/terminal
                    value: T2
                  - op: copy
                    from: /location
                    path: /backupLocation
                  - op: move
                    from: /visaStatus
                    path: /oldVisaStatus
              replaceAndRemove:
                summary: Replace and Remove operation
                value:
                  - op: replace
                    path: /Name
                    value: Name Updated
                  - op: remove
                    path: /Description
              nestedPathUpdate:
                summary: Deep nested property update
                value:
                  - op: replace
                    path: /properties/from/name
                    value: Chhatrapati Shivaji Maharaj International Airport
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  message:
                    type: string
                    example: User 'T006' updated successfully
                  status:
                    type: string
                    example: SUCCESS
        '400':
          description: Bad Request (Invalid JSON Patch format, non-array body, or failed test op)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                message: "Invalid JSON patch format. Expected a non-empty array of patch operations: [{ op, path, value }]"
                status: FAILURE
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [users]
      summary: Delete a user by ID (user/superuser)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  message:
                    type: string
                    example: User deleted successfully
                  status:
                    type: string
                    example: SUCCESS
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── ADMIN ─────────────────────────────────────────────────────────────────

  /api/v1/admins:
    post:
      tags: [admin]
      summary: Create a new admin record (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminInput'
      responses:
        '201':
          description: Admin record created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  postBatchResponseData:
                    type: object
                  message:
                    type: string
                    example: Admin record created successfully.
                  status:
                    type: string
                    example: SUCCESS
        '400':
          description: Failed to create admin record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [admin]
      summary: Get all admins (requires auth)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Admin list returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Admin'
                  message:
                    type: string
                    example: Data fetched successfully
                  status:
                    type: string
                    example: SUCCESS
        '400':
          description: Error fetching admins
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admins/bulk:
    delete:
      tags: [admin]
      summary: Bulk delete admins (requires auth)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  MID:
                    type: string
      responses:
        '202':
          description: Admins deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  message:
                    type: string
                    example: Whole ADMIN data has been deleted successfully
                  status:
                    type: string
                    example: SUCCESS
        '400':
          description: Error during bulk delete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admins/{MID}:
    get:
      tags: [admin]
      summary: Get admin by MID (requires auth)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: MID
          required: true
          schema:
            type: string
          example: ADM001
      responses:
        '200':
          description: Admin record returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Admin'
                  status:
                    type: string
                    example: SUCCESS
        '400':
          description: Error fetching admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [admin]
      summary: Update admin by MID (requires auth)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: MID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminInput'
      responses:
        '202':
          description: Admin updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Admin'
                  message:
                    type: string
                    example: Data with ADM001 updated successfully
                  status:
                    type: string
                    example: SUCCESS
        '404':
          description: Admin not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [admin]
      summary: Delete admin by MID (requires auth)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: MID
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Admin deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Admin'
                  message:
                    type: string
                    example: Data with ADM001 deleted successfully
                  status:
                    type: string
                    example: SUCCESS
        '404':
          description: Admin not found or already deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/admin-sessions:
    post:
      tags: [admin]
      summary: Admin login — issue access_token + refresh_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [MID, MPIN]
              properties:
                MID:
                  type: string
                  example: ADM001
                MPIN:
                  type: string
                  example: "1234"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenPair'
                  - type: object
                    properties:
                      status:
                        type: string
                        example: SUCCESS
        '400':
          description: MID or MPIN missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/admin-sessions/refresh:
    post:
      tags: [admin]
      summary: Refresh admin access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenPair'
                  - type: object
                    properties:
                      status:
                        type: string
                        example: SUCCESS
        '400':
          description: refresh_token missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/admin-sessions/revoke:
    post:
      tags: [admin]
      summary: Revoke admin refresh token (logout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Admin logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Token revoked successfully. You are logged out.
                  status:
                    type: string
                    example: SUCCESS
        '400':
          description: refresh_token missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users-details:
    get:
      tags: [admin]
      summary: Get all users data (admin view, requires auth)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Users data returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  status:
                    type: string
                    example: SUCCESS
        '400':
          description: Error fetching users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── AIRPORTS ──────────────────────────────────────────────────────────────

  /api/v1/airports:
    get:
      tags: [airports]
      summary: Get all airports
      responses:
        '200':
          description: Airport list returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Airport'
                  message:
                    type: string
                    example: Airports fetched successfully
                  status:
                    type: string
                    example: SUCCESS
        '400':
          description: Error fetching airports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/airports/{airportCode}:
    get:
      tags: [airports]
      summary: Get a single airport by IATA code
      parameters:
        - in: path
          name: airportCode
          required: true
          schema:
            type: string
          example: BOM
      responses:
        '200':
          description: Airport fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Airport'
                  message:
                    type: string
                    example: Airport fetched successfully
                  status:
                    type: string
                    example: SUCCESS
        '404':
          description: Airport not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Error fetching airport
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [airports]
      summary: Update an airport by IATA code
      parameters:
        - in: path
          name: airportCode
          required: true
          schema:
            type: string
          example: BOM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Airport'
      responses:
        '200':
          description: Airport updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Airport'
                  message:
                    type: string
                    example: Airport BOM updated successfully
                  status:
                    type: string
                    example: SUCCESS
        '404':
          description: Airport not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Error updating airport
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── PRICING ───────────────────────────────────────────────────────────────

  /api/v1/prices:
    post:
      tags: [pricing]
      summary: Create price records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PriceInput'
      responses:
        '201':
          description: Price records created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  message:
                    type: string
                    example: Price records created successfully
                  status:
                    type: string
                    example: SUCCESS
        '400':
          description: Error creating price records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [pricing]
      summary: Get all price records
      responses:
        '200':
          description: Prices fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Price'
                  message:
                    type: string
                    example: Prices fetched successfully
                  status:
                    type: string
                    example: SUCCESS
        '400':
          description: Error fetching prices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

