                              example: Tuesday
                            name:
                              type: string
                              example: Diwali-Balipratipada
                  status:
                    type: string
                    example: SUCCESS

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # ── Shared ──────────────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      properties:
        data:
          nullable: true
          example: null
        message:
          type: string
          example: Something went wrong
        status:
          type: string
          example: FAILURE
        error:
          type: string
          example: Detailed error message

    TooManyRequestsResponse:
      type: object
      properties:
        data:
          nullable: true
          example: null
        message:
          type: string
          example: Too many requests. Rate limit exceeded. Please retry after 25 seconds.
        status:
          type: string
          example: TOO_MANY_REQUESTS
        retry_after:
          type: integer
          example: 25

    UnauthorizedResponse:
      type: object
      properties:
        message:
          type: string
          example: Authorization header missing or malformed
        status:
          type: string
          example: UNAUTHORIZED

    ForbiddenResponse:
      type: object
      properties:
        message:
          type: string
          example: Access denied. Required role - admin or superadmin
        status:
          type: string
          example: FORBIDDEN

    TokenPair:
      type: object
      properties:
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expires_in:
          type: integer
          example: 3600
        user:
          type: object
          properties:
            id:
              type: string
              example: user123
            name:
              type: string
              example: John Doe

    # ── Users ───────────────────────────────────────────────────────────────

    User:
      type: object
      properties:
        _id:
          type: string
          example: 6a886b739b6a5ddb9b90ba51
        id:
          type: string
          example: T006
        name:
          type: string
          example: timtim
        mobileNumber:
          type: string
          example: "+919876543210"
        location:
          type: string
          example: cg
        date:
          type: string
          format: date-time
          example: '2026-08-21T00:00:00.000Z'
        country:
          type: string
          example: India
        visaStatus:
          type: string
          example: Approved
        eDate:
          type: string
          format: date-time
        hasPassword:
          type: boolean
          example: true
        role:
          type: string
          enum: [user, superuser, admin, superadmin]
          example: user
        properties:
          type: object
          nullable: true
          properties:
            from:
              type: object
              properties:
                _id:
                  type: string
                city:
                  type: string
                  example: Mumbai
                code:
                  type: string
                  example: BOM
                country:
                  type: string
                  example: India
                name:
                  type: string
                  example: Chhatrapati Shivaji International Airport
            to:
              type: object
              properties:
                _id:
                  type: string
                city:
                  type: string
                  example: Bangalore
                code:
                  type: string
                  example: BLR
                country:
                  type: string
                  example: India
                name:
                  type: string
                  example: Kempegowda International Airport
            class:
              type: string
              example: Premium Economy Class
            date:
              type: string
              example: '2025-11-28'
            seat:
              type: string
              example: 3AE
            setNewsletter:
              type: boolean
              example: false
        musicList:
          type: array
          items:
            type: object

    UserInput:
      type: object
      required: [id, password]
      properties:
        id:
          type: string
          example: user@example.com
        password:
          type: string
          example: strongPassword123
        role:
          type: string
          enum: [user, superuser, admin, superadmin]
          example: user

    JsonPatchOperation:
      type: object
      required: [op, path]
      properties:
        op:
          type: string
          enum: [add, replace, remove, copy, move, test]
          description: RFC 6902 patch operation code
          example: replace
        path:
          type: string
          description: RFC 6901 JSON pointer path (case-insensitive key lookup supported)
          example: /properties/from/name
        value:
          description: Value for add, replace, or test operations
          example: Chhatrapati Shivaji Maharaj International Airport
        from:
          type: string
          description: Source JSON pointer path for copy and move operations
          example: /location

    # ── Admins ──────────────────────────────────────────────────────────────

    Admin:
      type: object
      properties:
        _id:
          type: string
        MID:
          type: string
          example: ADM001
        role:
          type: string
          example: admin

    AdminInput:
      type: object
      required: [MID, MPIN]
      properties:
        MID:
          type: string
          example: ADM001
        MPIN:
          type: string
          example: "1234"
        role:
          type: string
          example: admin

    # ── Airports ────────────────────────────────────────────────────────────

    Airport:
      type: object
      properties:
        _id:
          type: string
        airportCode:
          type: string
          example: BOM
        airportName:
          type: string
          example: Chhatrapati Shivaji Maharaj International Airport
        city:
          type: string
          example: Mumbai
        country:
          type: string
          example: India

    # ── Pricing ─────────────────────────────────────────────────────────────

    Price:
      type: object
      properties:
        _id:
          type: string
        codeFrom:
          type: string
          example: BOM
        codeTo:
          type: string
          example: DEL
        price:
          type: number
          example: 3500
        currency:
          type: string
          example: INR

    PriceInput:
      type: object
      required: [codeFrom, codeTo, price]
      properties:
        codeFrom:
          type: string
          example: BOM
        codeTo:
          type: string
          example: DEL
        price:
          type: number
          example: 3500
        currency:
          type: string
          example: INR

    # ── Blogs ───────────────────────────────────────────────────────────────

    Blog:
      type: object
      properties:
        _id:
          type: string
        slug:
          type: string
          example: top-10-airports
        title:
          type: string
          example: Top 10 Airports in India
        content:
          type: string
        author:
          type: string
        createdAt:
          type: string
          format: date-time

    BlogInput:
      type: object
      required: [slug, title]
      properties:
        slug:
          type: string
          example: top-10-airports
        title:
          type: string
          example: Top 10 Airports in India
        content:
          type: string
        author:
          type: string

    # ── Countries ───────────────────────────────────────────────────────────

    Country:
      type: object
      properties:
        _id:
          type: string
        countryCode:
          type: string
          example: IN
        countryName:
          type: string
          example: India
        flag:
          type: string
          example: IN-flag

    CountryInput:
      type: object
      required: [countryCode, countryName]
      properties:
        countryCode:
          type: string
          example: IN
        countryName:
          type: string
          example: India
        flag:
          type: string

    # ── Bookings ────────────────────────────────────────────────────────────

