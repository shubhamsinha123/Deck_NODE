      summary: Fetch real-time Indian benchmark indices (NIFTY 50, SENSEX, BANK NIFTY, INDIA VIX)
      description: Real-time broadcast feeds with exchange timestamps down to the second, Indian market session status, and a 10s live buffer (?fresh=true bypasses cache).
      parameters:
        - in: query
          name: fresh
          schema:
            type: boolean
          required: false
          description: Set to true to bypass the 10s in-memory cache and fetch immediate exchange quotes.
      responses:
        '200':
          description: Benchmark market indices fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: NIFTY 50
                        symbol:
                          type: string
                          example: ^NSEI
                        exchange:
                          type: string
                          example: NSE
                        current_price:
                          type: number
                          example: 24902.1
                        change:
                          type: number
                          example: -84.3
                        change_percent:
                          type: number
                          example: -0.34
                        timestamp:
                          type: string
                          format: date-time
                        data_source:
                          type: string
                          example: YAHOO_V8_NSE
                        data_tag:
                          type: string
                          example: realtime
                  count:
                    type: integer
                    example: 5
                  market:
                    type: object
                    properties:
                      session:
                        type: string
                        example: OPEN
                      is_live:
                        type: boolean
                        example: true
                      trading_hours:
                        type: string
                        example: 09:15 - 15:30 IST (Monday - Friday)
                      ist_time:
                        type: string
                        example: 10:40:09 am
                  last_updated:
                    type: string
                    format: date-time
                  status:
                    type: string
                    example: SUCCESS
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

